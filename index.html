<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ToMyGirlfriend</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="overflow-hidden bg-pink-50 font-sans select-none">

    <!-- 画面コンテナ -->
    <div id="app-container" class="relative w-screen h-screen flex flex-col items-center justify-between">
        
        <!-- ヘルプ・タイトルメッセージ -->
        <div id="instruction-banner" class="absolute top-8 z-10 text-center pointer-events-none transition-opacity duration-500 w-full px-4">
            <h1 class="text-slate-800 text-xl font-bold tracking-wider drop-shadow-sm">世界で一番かわいいゆあちへ</h1>
            <p id="guide-text" class="text-pink-600 text-sm mt-1 animate-pulse">左右にスワイプして、回して！</p>
            
            <!-- 回転量・スピードメーター（写真の上・引っ張り不可） -->
            <div id="progress-container" class="pointer-events-none mt-3 mx-auto w-48 h-3.5 bg-white/80 rounded-full overflow-visible shadow-inner border border-pink-200 p-0.5 flex items-center">
                <div id="progress-bar" class="h-full bg-pink-500 rounded-full w-0 transition-all duration-100 relative flex items-center justify-end">
                    <span class="absolute -right-2 text-xs select-none">❤️</span>
                </div>
            </div>
        </div>

        <!-- 3D Canvas -->
        <canvas id="webgl-canvas" class="absolute inset-0 w-full h-full z-0"></canvas>

        <!-- 写真操作時のキャプション -->
        <div id="photo-ui" class="absolute bottom-12 z-10 hidden flex flex-col items-center w-full px-6 pointer-events-none">
            <div id="photo-caption" class="bg-white/90 backdrop-blur-md text-slate-800 px-5 py-2.5 rounded-full text-sm border border-pink-200 shadow-lg text-center max-w-xs truncate font-medium pointer-events-auto">
                思い出のアルバム
            </div>
        </div>

        <!-- 最初からやり直すボタン -->
        <button id="reset-btn" class="absolute top-4 right-4 z-20 bg-white/80 hover:bg-white text-slate-700 text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-pink-200 transition-all hidden shadow-sm">
            最初から
        </button>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
